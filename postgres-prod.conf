# =========================================================
# PostgreSQL 16 Production Performance Configuration
# Optimized for: 2GB - 4GB Dedicated DB Instance (e.g., AWS RDS / GCP Cloud SQL / Render PG)
# =========================================================

# ---------------------------------------------------------
# 1. Connection Limits & Memory Sizing
# ---------------------------------------------------------
max_connections = 100                   # Moderate pool to prevent connection exhaustion
shared_buffers = 1024MB                 # 25% of total RAM
effective_cache_size = 3072MB           # 75% of total RAM
maintenance_work_mem = 256MB            # Reserved for index creation and autovacuum tasks
work_mem = 10MB                         # RAM allocated per-query sort/hash operation

# ---------------------------------------------------------
# 2. Write-Ahead Logging (WAL) & Crash Recovery Safety
# ---------------------------------------------------------
wal_level = replica                     # Enables replication and backup strategies
synchronous_commit = on                 # Guarantee transactions are written before return (Data safety)
checkpoint_timeout = 15min              # Reduce disk write frequency (default 5min)
checkpoint_completion_target = 0.9      # Smooth out write operations during checkpoints
max_wal_size = 2GB                      # Maximum log size before flushing
min_wal_size = 512MB                    # Retained logs for high-throughput writes

# ---------------------------------------------------------
# 3. Dynamic Autovacuum Tuning (Prevent Table Bloat)
# ---------------------------------------------------------
autovacuum = on                         # Enable the automatic dead-tuple scavenger
autovacuum_max_workers = 3              # Worker count for database maintenance
autovacuum_vacuum_scale_factor = 0.10   # Trigger vacuum when 10% of rows are updated/deleted
autovacuum_analyze_scale_factor = 0.05  # Trigger analyze when 5% of rows are updated/deleted
autovacuum_vacuum_cost_limit = 200      # Controls CPU throttles during heavy autovacuum cycles

# ---------------------------------------------------------
# 4. Performance Optimizer & Planner Settings
# ---------------------------------------------------------
random_page_cost = 1.1                  # Optimized for SSD storage (SATA/NVMe). Default is 4.0 for HDDs.
effective_io_concurrency = 200          # Utilize parallel read capabilities on modern SSD arrays

# ---------------------------------------------------------
# 5. Production Audit, Logging & Query Diagnosis
# ---------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning               # Suppress minor debug messages in production logs
log_min_error_statement = error         # Log statements causing database errors
log_min_duration_statement = 250        # Log any query taking longer than 250ms (Slow-Query tracking)
log_line_prefix = '%m [%p] %q%u@%d '   # Format prefixes: Timestamp, ProcessID, Username, DatabaseName

# ---------------------------------------------------------
# 6. Localization & Security Standards
# ---------------------------------------------------------
client_min_messages = notice
ssl = on                                # FORCE SSL connections for security-sensitive ERP data
ssl_prefer_server_ciphers = on
password_encryption = scram-sha-256     # Leverage modern, secure passwords encryption hashes
