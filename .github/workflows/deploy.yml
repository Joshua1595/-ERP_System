name: ERP Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # Job 1: Lint, Validate, and Test Codebase
  # ==========================================
  validate-and-test:
    name: Code Validation & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_admin
          POSTGRES_PASSWORD: TestPassword123!
        ports:
          - 5432:5432
        # Ensure postgres is fully running
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Prisma Schema Formats
        run: npx prisma format --schema=./prisma/schema.prisma

      - name: Validate Database Migrations
        run: npx prisma migrate dev --name init --create-only
        env:
          DATABASE_URL: postgresql://erp_admin:TestPassword123!@localhost:5432/erp_test?schema=public

      - name: Run Production Application Compilation
        run: npm run build

      # Note: Toggle tests if database is required or if it mocks responses
      - name: Run Integration Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://erp_admin:TestPassword123!@localhost:5432/erp_test?schema=public
          JWT_SECRET: super-secure-ci-secret-key-at-least-32-chars-long
          JWT_REFRESH_SECRET: super-secure-ci-refresh-secret-key-at-least-32-chars-long

  # ==========================================
  # Job 2: Build & Verify Production Container
  # ==========================================
  build-docker:
    name: Production Container Verification
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false # Set to true and supply credentials for automated Registry deployment
          tags: erp-application:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for Docker buildx cache growth
      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ==========================================
  # Job 3: Automated Deploy (Render & Vercel)
  # ==========================================
  deploy:
    name: Production Deployment Gateway
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Webhook Trigger Render Production Deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -f -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Document Deployment Actions Completed
        run: |
          echo "🚀 Verification and production trigger signals dispatched successfully."
