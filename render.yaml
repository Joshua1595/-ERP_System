# =========================================================
# Render Infrastructure-as-Code (IaC) Deployment Blueprint
# =========================================================
services:
  - type: web
    name: erp-application-service
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: erp-production-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Generates a secure, cryptographically random secret key
      - key: JWT_REFRESH_SECRET
        generateValue: true # Generates a secure, cryptographically random refresh key
      - key: STORAGE_PROVIDER
        value: local
      - key: APP_URL
        sync: false # Provide the final custom domain / Render sub-domain once active
    disk:
      name: erp-uploads-disk
      mountPath: /app/uploads
      sizeGB: 10

databases:
  - name: erp-production-db
    plan: starter
    region: oregon
    databaseName: erp_production
    user: erp_admin
